<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="luxBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2026"/>
      <stop offset="85%" stop-color="#140f12"/>
      <stop offset="100%" stop-color="#0a0809"/>
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedef"/>
      <stop offset="30%" stop-color="#e8b4b8"/>
      <stop offset="70%" stop-color="#d49a9e"/>
      <stop offset="100%" stop-color="#b57377"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Badge with Rose Gold Rim -->
  <circle cx="64" cy="64" r="62" fill="url(#luxBg)" stroke="url(#roseGold)" stroke-width="3" />
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#roseGold)" stroke-width="1" opacity="0.4" stroke-dasharray="3,3" />

  <!-- Lusentic Luxury Center Emblem: 4-Point Star Sparkle -->
  <g filter="url(#glow)">
    <!-- Main Diamond Star -->
    <path d="M64 16 C64 42 42 64 16 64 C42 64 64 86 64 112 C64 86 86 64 112 64 C86 64 64 42 64 16 Z" fill="url(#roseGold)" />
    <!-- Secondary Diagonal Star -->
    <path d="M64 34 C64 50 50 64 34 64 C50 64 64 78 64 94 C64 78 78 64 94 64 C78 64 64 50 64 34 Z" fill="url(#gold)" opacity="0.85" />
    <!-- Core Bright Sparkle -->
    <circle cx="64" cy="64" r="5" fill="#ffffff" />
    
    <!-- Top-Right Companion Sparkle -->
    <path d="M96 26 C96 32 92 36 86 36 C92 36 96 40 96 46 C96 40 100 36 106 36 C100 36 96 32 96 26 Z" fill="url(#gold)" />
    <!-- Bottom-Left Soft Glow Circle -->
    <circle cx="34" cy="94" r="4" fill="url(#roseGold)" opacity="0.75" />
  </g>
</svg>
